services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: paytrace
      POSTGRES_PASSWORD: paytrace
      POSTGRES_DB: paytrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
